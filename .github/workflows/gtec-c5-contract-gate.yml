name: GTEC C5 Contract Gate

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main

concurrency:
  group: gtec-c5-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gtec-c5-backend-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: realaicoach_ci
      JWT_SECRET: gtec-c5-ci-jwt-secret
      RESEND_API_KEY: ci-not-used
      RESEND_FROM_EMAIL: ci@example.com
      PAYPAL_CLIENT_ID: ci-not-used
      PAYPAL_SECRET: ci-not-used
      STRIPE_SECRET_KEY: ci-not-used
      EMERGENT_LLM_KEY: ci-not-used
      REACT_APP_BACKEND_URL: http://127.0.0.1:8001
      FRONTEND_URL: http://127.0.0.1:3000
      FRONTEND_BASE_URL: http://127.0.0.1:3000
      ADMIN_EMAILS: admin@realaicoach.app
      ADMIN_OVERRIDE_EMAILS: admin@realaicoach.app
      ADMIN_EMAIL: admin@realaicoach.app
      ADMIN_PASSWORD: NewAdminPass2026!
      PROGRESSIVE_RISK_PREVIEW_BYPASS_ENABLED: "true"
      PROGRESSIVE_RISK_PREVIEW_BYPASS_EMAILS: admin@realaicoach.app
      FIELD_ENCRYPTION_KEY: ci-field-encryption-key-32-bytes-minimum
      FIELD_LOOKUP_HMAC_KEY: ci-field-lookup-hmac-key-32-bytes-minimum

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Start backend API
        run: |
          nohup python -m uvicorn backend.server:app --host 127.0.0.1 --port 8001 > /tmp/gtec-c5-backend.log 2>&1 &

      - name: Wait for backend health
        run: |
          python - <<'PY'
          import time, requests
          url = "http://127.0.0.1:8001/api/health"
          last_err = None
          for _ in range(60):
            try:
              r = requests.get(url, timeout=2)
              if r.status_code == 200:
                print("Backend healthy")
                raise SystemExit(0)
              last_err = f"status={r.status_code}"
            except Exception as exc:
              last_err = str(exc)
            time.sleep(2)
          print(f"Backend failed health check: {last_err}")
          raise SystemExit(1)
          PY

      - name: Run GTEC C5 contract suite
        run: |
          pytest -q backend/tests/test_gtec_c5_*.py -rA

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gtec-c5-backend-log
          path: /tmp/gtec-c5-backend.log
          retention-days: 7
          if-no-files-found: warn