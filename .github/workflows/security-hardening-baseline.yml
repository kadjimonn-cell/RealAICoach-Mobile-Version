name: security-hardening-baseline

on:
  pull_request:
  push:
    branches: ["main", "master"]

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run security hardening gate
        run: python security/ci_security_gate.py
