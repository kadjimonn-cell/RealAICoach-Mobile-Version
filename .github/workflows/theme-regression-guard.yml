name: Theme Regression Guard

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  theme-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run theme regression guard
        run: python scripts/theme_regression_guard.py
