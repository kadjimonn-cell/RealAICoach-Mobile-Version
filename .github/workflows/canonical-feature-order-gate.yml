name: Canonical Feature Order Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  canonical-feature-order-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run canonical feature order integrity test
        env:
          REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL }}
        run: |
          pytest -q backend/tests/test_canonical_feature_order_integrity.py
