name: locked-protocol-release-gates

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main

jobs:
  i18n-and-polling-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run i18n + polling contract tests
        id: contract_tests
        continue-on-error: true
        run: |
          pytest -q \
            backend/tests/test_i18n_language_switch_deadlock_contract.py \
            backend/tests/test_polling_guardrails_locked_protocol_contract.py \
            backend/tests/test_polling_guardrails_release_gate_contract.py

      - name: Run locked protocol script gate (CI mode)
        id: locked_protocol_script_gate
        continue-on-error: true
        env:
          ROOT_DIR: ${{ github.workspace }}
          REPORT_DIR: ${{ github.workspace }}/test_reports
          BACKEND_LOG_PATH: /tmp/backend.out.log
        run: |
          mkdir -p "$REPORT_DIR"
          touch "$BACKEND_LOG_PATH"
          bash scripts/polling_guardrails_locked_protocol_check.sh

      - name: Aggregate locked-protocol gate verdict
        if: always()
        run: |
          CONTRACT_OUTCOME="${{ steps.contract_tests.outcome }}"
          SCRIPT_OUTCOME="${{ steps.locked_protocol_script_gate.outcome }}"

          echo "contract_tests_outcome=${CONTRACT_OUTCOME}"
          echo "locked_protocol_script_gate_outcome=${SCRIPT_OUTCOME}"

          FAILURES=0
          if [ "$CONTRACT_OUTCOME" != "success" ]; then
            echo "LOCKED_PROTOCOL_GATE_FAILURE=contract_tests"
            FAILURES=$((FAILURES + 1))
          fi

          if [ "$SCRIPT_OUTCOME" != "success" ]; then
            echo "LOCKED_PROTOCOL_GATE_FAILURE=locked_protocol_script_gate"
            FAILURES=$((FAILURES + 1))
          fi

          if [ "$FAILURES" -gt 0 ]; then
            echo "LOCKED_PROTOCOL_RELEASE_GATES=FAIL (failures=${FAILURES})"
            exit 1
          fi

          echo "LOCKED_PROTOCOL_RELEASE_GATES=PASS"