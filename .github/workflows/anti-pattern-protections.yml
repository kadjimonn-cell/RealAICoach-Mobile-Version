name: Anti-Pattern Protections

# Lightweight static-grep regression gate that runs the 39 assertions
# pinning the Issue 1-5 + 13 + Redis fixes verified across multiple
# audit cycles. Fails fast (<30s) so PRs surface accidental regressions
# immediately — no MongoDB, no Redis, no network access required.

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  anti-pattern-protections:
    name: Anti-Pattern Protections (Issues 1-5, 13)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run anti-pattern protection tests
        working-directory: backend
        run: |
          python -m pytest \
            tests/test_issue3_whitescreen_protections.py \
            -v --tb=short --color=yes 2>&1 | tee /tmp/anti-pattern-output.txt
          exit ${PIPESTATUS[0]}

      - name: Summarize results
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, re

          out = pathlib.Path('/tmp/anti-pattern-output.txt')
          txt = out.read_text() if out.exists() else 'No output captured.'
          lines = [ln for ln in txt.strip().splitlines() if ln.strip()]
          summary_line = next((ln for ln in reversed(lines) if 'passed' in ln or 'failed' in ln or 'error' in ln), 'No summary line.')

          m = re.search(r'(\d+) passed', summary_line)
          passed = int(m.group(1)) if m else 0
          m_fail = re.search(r'(\d+) failed', summary_line)
          failed = int(m_fail.group(1)) if m_fail else 0

          status = 'PASS' if failed == 0 and passed > 0 else 'FAIL'
          emoji = '✅' if status == 'PASS' else '🛑'

          md = [
              f'## {emoji} Anti-Pattern Protections — {status}',
              '',
              '| Item | Value |',
              '|---|---|',
              f'| Passed | **{passed}** |',
              f'| Failed | **{failed}** |',
              f'| Result | `{summary_line}` |',
              f'| Commit | `{os.environ.get("GITHUB_SHA", "unknown")[:7]}` |',
              '',
              '**Pins regressions for:**',
              '- Issue 1 (server.py stale `routers.*` imports)',
              '- Issue 2 (metro 5xx→200 rewrite, FOUC, Zustand hydration)',
              '- Issue 3 (ErrorBoundary reload loops, LanguageContext overlay, middleware buffering)',
              '- Issue 4 (WebSocket consolidation, 2FA refresh, structured error_code)',
              '- Issue 5 (FlatList virtualization, useGLSBreakpoint, native style vars)',
              '- Issue 13 (poll-vs-WS races, useLiveQuery cache, $facet aggregation)',
              '- Redis operational sanity (binary installed + supervisor wired)',
          ]
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              pathlib.Path(summary_path).write_text('\n'.join(md) + '\n')
          print('\n'.join(md))
          PY

      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anti-pattern-protections-output
          path: /tmp/anti-pattern-output.txt
          retention-days: 14
          if-no-files-found: warn
